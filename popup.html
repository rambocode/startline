<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Startline</title>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <img src="icons/32.png" width="28" height="28" alt="">
    <p class="brand"><strong>Startline</strong><span id="ver"></span></p>
    <button class="icon-btn" data-act="home" title="打开导航" aria-label="打开导航"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></button>
    <button class="btn-ghost" data-act="settings">设置 <span aria-hidden="true">↗</span></button>
  </header>
  <!-- 启动占位：读到数据前不渲染默认值，整块 inert；文案内置，不依赖脚本 -->
  <main id="app" role="status" aria-busy="true" inert>
    <section class="card hero">
      <div class="page"><span class="fav" style="width:36px;height:36px"></span><div class="page-text"><p class="page-name">正在读取…</p><p class="page-host">—</p></div></div>
      <div class="chips"><span class="chip">—</span><span class="chip">—</span><span class="chip">—</span></div>
      <button class="btn-primary block" disabled>收藏</button>
    </section>
  </main>
</div>
<script src="shared.js"></script>
<script src="site-icon.js"></script>
<script src="ui.js"></script>
<script src="popup.js"></script>
</body>
</html>
