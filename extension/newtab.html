<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新标签页</title>
<link rel="icon" href="icons/32.png">
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icons/48.png" width="28" height="28" alt="">
      <span>Startline</span>
    </div>
    <div class="top-acts">
      <button class="icon-btn" data-act="settings" aria-label="设置" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
      <div class="hero-add" id="heroAdd"></div>
    </div>
  </header>
  <main class="main">
    <p class="clock"><span class="time" id="time"></span><span class="clock-sub"><span id="greet"></span><span id="date"></span></span></p>
    <div class="find">
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4.2-4.2"></path></svg>
        <input id="q" placeholder="搜索网址，回车打开" spellcheck="false" autocomplete="off" aria-label="搜索网址">
        <kbd>/</kbd>
      </label>
      <nav class="nav" id="nav" aria-label="分类"></nav>
    </div>
    <div id="list" aria-busy="true"></div>
  </main>
</div>
<div id="pop"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,image/x-icon" hidden>
<script src="shared.js"></script>
<script src="site-icon.js"></script>
<script src="ui.js"></script>
<script src="newtab.js"></script>
</body>
</html>
