<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startline · 原型</title>
<style>
/* ---------- 设计令牌：三个方向各一套 ---------- */
:root {
  --sans: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", serif;
  --font: var(--sans);
  --radius: 10px;
}
[data-theme="light"] {
  --bg: #f4f3f0; --surface: #ffffff; --hover: #eae8e3; --line: #e4e2dc;
  --text: #1c1c1e; --muted: #6a6a70; --accent: oklch(0.6 0.15 62);
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 4px 16px rgba(20,20,30,.05);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0f1011; --surface: #17181a; --hover: #1e2023; --line: #2a2c30;
  --text: #e8e6e1; --muted: #9a978f; --accent: oklch(0.82 0.15 78);
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
:root { --radius: 14px; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { flex: none; }
ol, ul { list-style: none; margin: 0; padding: 0; }
h1, h2, p { margin: 0; }

/* ---------- 通用小件 ---------- */
.letter { display: inline-grid; place-items: center; flex: none; border-radius: 28%; font-family: var(--sans); font-weight: 600; line-height: 1; background: oklch(0.93 0.045 var(--h)); color: oklch(0.42 0.13 var(--h)); }
.letter { background: oklch(0.92 0.04 var(--h)); color: oklch(0.42 0.12 var(--h)); border-radius: 4px; font-family: var(--mono); }
.mark { flex: none; }

.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: 15px; }
.search input::placeholder, .add-input::placeholder { color: var(--muted); }
kbd { font: 11px var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }

.keymark { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font: 11px var(--mono); }
.more { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--muted); opacity: 0; }
.more:hover { background: color-mix(in oklab, var(--text) 10%, transparent); color: var(--text); }
:is(.tile, .row, .entry):hover .more, .more:focus-visible { opacity: 1; }

.add { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--radius); color: var(--muted); font-size: 13px; }
.add:hover { background: var(--hover); color: var(--text); }
.add-input { height: 32px; min-width: 0; width: 100%; max-width: 220px; padding: 0 10px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); font-size: 13px; outline: none; }
.add-input.bad { border-color: oklch(0.6 0.2 25); }

.cat-title { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.cat-edit { width: 8em; padding: 0 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--surface); font: inherit; outline: none; }
.cat-del { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: var(--muted); }
.cat-del:hover { background: var(--hover); color: var(--text); }
.none { padding: 40px 0; text-align: center; color: var(--muted); }

.home { min-height: 100%; display: grid; }

.home { min-height: 100vh; display: grid; }

/* ---------- 首页布局 v2：宽松、大图标、卡片 ---------- */
.ht { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100%; font-size: 15px; }
.ht-side { position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 28px; padding: 32px 18px 20px; border-right: 1px solid var(--line); }
.ht-brand { display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.ht-nav { display: flex; flex-direction: column; gap: 2px; }
.ht-nav button { display: flex; justify-content: space-between; align-items: center; height: 42px; padding: 0 14px; border-radius: 10px; color: var(--muted); font-size: 15px; text-align: left; }
.ht-nav button:hover { background: var(--hover); color: var(--text); }
.ht-nav button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.n { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.ht-side .add { align-self: flex-start; height: 40px; padding: 0 14px; }
.ht-main { width: 100%; max-width: 1280px; padding: 56px clamp(28px, 5vw, 72px) 120px; display: flex; flex-direction: column; gap: 44px; min-width: 0; }
.ht-hero h1 { font-size: clamp(34px, 4vw, 46px); font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; }
.ht-hero p { margin-top: 10px; display: flex; align-items: baseline; gap: 14px; color: var(--muted); font-size: 16px; }
.ht-time { color: var(--text); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ht-hero + .search { margin-top: -16px; }
.ht .search { height: 60px; padding: 0 22px; gap: 14px; border-radius: 18px; border-color: transparent; box-shadow: var(--shadow); }
.ht .search input { font-size: 17px; }
.ht .search:focus-within { border-color: var(--accent); }
.ht-freq { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.ht-freq button { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 8px 16px; border-radius: 18px; font-size: 14px; }
.ht-freq button:hover { background: var(--surface); box-shadow: var(--shadow); }
.ht-freq button span:last-child { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ht-sec { display: flex; flex-direction: column; gap: 16px; }
.ht-sec-head { display: flex; align-items: baseline; gap: 10px; }
.ht .cat-title { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
.ht-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.row { position: relative; display: flex; align-items: center; min-height: 76px; padding-right: 10px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.row:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,20,30,.05), 0 10px 28px rgba(20,20,30,.09); }
.row-main { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; padding: 16px 0 16px 16px; text-align: left; }
.row-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-name { font-size: 15.5px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row-domain { font-size: 12.5px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .keymark { position: absolute; top: 10px; right: 12px; }
.row .more { width: 30px; height: 30px; }
.ht-rows .add { justify-content: center; min-height: 76px; border: 1.5px dashed var(--line); border-radius: var(--radius); font-size: 14px; }
.ht-rows .add:hover { border-color: var(--muted); background: transparent; }
.ht-rows .add-input { max-width: none; height: 76px; padding: 0 16px; font-size: 15px; }
.letter { border-radius: 26%; font-family: var(--sans); }
.mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: auto; height: 38px; border-radius: 12px; padding: 3px; background: var(--hover); border: 0; }
.mode button { color: var(--muted); height: 32px; border-radius: 9px; font-size: 13px; }
.mode button.on { color: var(--text);  background: var(--surface); box-shadow: var(--shadow); }
[data-theme="dark"] .row:hover { box-shadow: 0 8px 24px rgba(0,0,0,.4); }
[data-theme="dark"] .ht .search { border-color: var(--line); }
[data-theme="dark"] .letter { background: oklch(0.32 0.05 var(--h)); color: oklch(0.88 0.1 var(--h)); }

/* ---------- 浮层：网址详情 ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; }
.pop { position: fixed; z-index: 41; width: 280px; padding: 14px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); border-radius: calc(var(--radius) + 2px); background: var(--surface); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); font: 13px/1.5 var(--sans); animation: pop-in 0.14s ease-out; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } }
.pop-head { display: flex; align-items: center; gap: 10px; }
.pop-id { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.pop-id span { font: 11.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 13px; font-size: 12px; color: var(--muted); }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.creds { display: flex; flex-direction: column; border-top: 1px solid color-mix(in oklab, var(--text) 12%, transparent); }
.creds li { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-bottom: 1px solid color-mix(in oklab, var(--text) 12%, transparent); color: var(--muted); }
.cred-id { flex: 1; min-width: 0; display: flex; flex-direction: column; margin-left: 6px; line-height: 1.35; }
.cred-user { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cred-pass { font: 11.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.creds button { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; }
.creds button:hover { background: var(--hover); color: var(--text); }
.pop-remove { align-self: flex-start; font-size: 12px; color: oklch(0.58 0.19 25); }
.pop-remove:hover { text-decoration: underline; }
.ext-ok { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--accent); }
.ext-foot { display: flex; justify-content: space-between; align-items: center; }
.ext-keys { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }

.toast { position: fixed; z-index: 50; top: 16px; right: 16px; display: flex; align-items: center; gap: 10px; max-width: min(420px, calc(100vw - 32px)); padding: 10px 14px; border: 1px solid var(--line); border-radius: calc(var(--radius) + 2px); background: var(--surface); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); font: 13px var(--sans); animation: pop-in 0.18s ease-out; }
.toast-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { flex: none; color: var(--accent); font-weight: 600; }
.toast button:hover { text-decoration: underline; }

/* ---------- Tweaks 面板 ---------- */
.tweaks { position: fixed; z-index: 60; right: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font: 12px var(--sans); }
.tweaks-toggle { height: 28px; padding: 0 12px; border-radius: 14px; background: #1b1b1f; color: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); }
.tweaks-panel { width: 200px; padding: 12px; display: flex; flex-direction: column; gap: 9px; border-radius: 12px; background: #1b1b1f; color: #f2f2f4; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3); }
.tweaks-panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tweaks-reset { align-self: flex-start; color: #b9b9c2; text-decoration: underline; }

@media (max-width: 720px) {
  .ht { grid-template-columns: minmax(0, 1fr); }
  .ht-side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .ht-nav { flex-direction: row; flex-wrap: wrap; }
  .ht-nav button { gap: 8px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="home-v2.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
